<p-dialog header="Change Password" [visible]="open()" (visibleChange)="open.set($event)" [modal]="true" [style]="{ width: '26rem' }">
  <div class="flex flex-col gap-1 mb-4">
    <label for="cp-current" class="text-sm font-semibold">Current Password</label>
    <input id="cp-current" pInputText type="password"
           [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" class="w-full" />
  </div>
  <div class="flex flex-col gap-1 mb-4">
    <label for="cp-new" class="text-sm font-semibold">New Password</label>
    <input id="cp-new" pInputText type="password"
           [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" class="w-full" />
  </div>
  <div class="flex flex-col gap-1 mb-4">
    <label for="cp-confirm" class="text-sm font-semibold">Confirm New Password</label>
    <input id="cp-confirm" pInputText type="password"
           [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" class="w-full" />
    @if (newPassword() && newPassword().length < 8) {
      <small class="text-xs text-red-600 mt-1">Must be at least 8 characters.</small>
    } @else if (confirmPassword() && newPassword() !== confirmPassword()) {
      <small class="text-xs text-red-600 mt-1">Passwords don't match.</small>
    }
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" (onClick)="open.set(false)" />
    <p-button label="Change Password" [loading]="submitting()" (onClick)="submit()" />
  </ng-template>
</p-dialog>
