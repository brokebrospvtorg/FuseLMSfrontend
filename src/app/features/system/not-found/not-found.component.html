<div class="not-found min-h-screen flex flex-col items-center justify-center gap-8 p-8 text-center
            bg-[radial-gradient(circle_at_30%_20%,_#1b2b52_0%,_#0c1732_55%,_#060c1f_100%)]">

  <img src="assets/images/inklings-logo-mono.png" alt="Inklings Academy"
       class="w-36 h-auto opacity-80 drop-shadow-lg invert" />

  <div class="flex flex-col items-center gap-3">
    <span class="not-found__code font-[family-name:var(--font-serif-display)] font-bold text-white leading-none">
      404
    </span>
    <h1 class="font-[family-name:var(--font-serif-display)] font-bold text-2xl md:text-3xl text-white">
      Page Not Found
    </h1>
    <p class="text-sm md:text-base text-slate-300 max-w-sm">
      Oops! The page you are looking for does not exist. It may have been moved, renamed, or the link
      might be incorrect.
    </p>
  </div>

  <button
    type="button"
    (click)="goHome()"
    class="mt-2 px-7 py-3 rounded-xl bg-white text-navy font-semibold
           hover:bg-slate-100 transition-colors shadow-lg">
    {{ isAuthenticated ? 'Back to Dashboard' : 'Back to Login' }}
  </button>

  <div class="text-center text-xs text-slate-400 mt-8 pt-5 border-t border-white/10 w-full max-w-xs">
    powered by <span class="font-bold underline text-slate-200">fuse</span> LMS
  </div>
</div>
