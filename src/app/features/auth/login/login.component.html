<div class="min-h-screen flex items-center justify-center gap-16 p-8 md:flex-row flex-col md:gap-16 gap-8 md:p-8 p-6
            bg-[radial-gradient(circle_at_30%_20%,_#1b2b52_0%,_#0c1732_55%,_#060c1f_100%)]">

  <!-- Brand side -->
  <div class="max-w-md text-left md:text-left text-center text-slate-100">
    <img src="assets/images/inklings-logo-mono.png" alt="Inklings Academy"
         class="w-48 h-auto mb-8 mx-auto md:mx-0 opacity-90 drop-shadow-lg invert" />

    <p class="text-lg opacity-85 mb-1">Welcome Back to</p>
    <h1 class="font-[family-name:var(--font-serif-display)] font-bold text-5xl leading-tight text-white">
      Inklings<br />Academy
    </h1>
  </div>

  <!-- Login card -->
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl px-9 pt-10 pb-8">
    <h2 class="font-[family-name:var(--font-serif-display)] text-2xl text-navy text-center mb-6">
      Login Portal
    </h2>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5 mt-2">
      <div class="flex flex-col gap-1.5">
        <label for="identifier" class="text-sm font-semibold text-navy flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
          Email or Username
        </label>
        <input
          id="identifier"
          type="text"
          name="identifier"
          autocomplete="username"
          [(ngModel)]="identifier"
          class="w-full border-0 border-b border-slate-300 py-2 px-0.5 text-base
                 focus:outline-none focus:border-navy transition-colors bg-transparent" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-sm font-semibold text-navy">Password</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [(ngModel)]="password"
            class="w-full border-0 border-b border-slate-300 py-2 px-0.5 pr-8 text-base
                   focus:outline-none focus:border-navy transition-colors bg-transparent" />
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            class="absolute right-0 top-1/2 -translate-y-1/2 text-slate-400 hover:text-navy transition-colors"
            aria-label="Toggle password visibility">
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/>
                <path d="M2 2l20 20"/>
                <path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full mt-1 py-3 rounded-xl bg-navy text-white font-semibold
               hover:bg-[#1c2d54] transition-colors disabled:opacity-60 disabled:cursor-not-allowed
               flex items-center justify-center gap-2">
        @if (loading()) {
          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
          </svg>
        }
        Log In
      </button>

      <a href="#" (click)="$event.preventDefault(); requestPasswordResetFromAdmin()"
         class="text-center text-sm text-navy underline">Forgot / Reset Password?</a>
    </form>

    <div class="text-center text-xs text-slate-400 mt-6 pt-5 border-t border-slate-100">
      powered by <span class="font-bold underline text-navy">fuse</span> LMS
    </div>
  </div>
</div>
